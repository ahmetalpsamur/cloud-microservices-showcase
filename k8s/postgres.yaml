apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: showcase
type: Opaque
stringData:
  POSTGRES_DB: orders
  POSTGRES_USER: orders
  POSTGRES_PASSWORD: orders
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: showcase
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: postgres-credentials
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orders"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: showcase
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
