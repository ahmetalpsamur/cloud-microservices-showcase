apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: showcase-ingress
  namespace: showcase
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /events(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: go-service
                port:
                  number: 8080
          - path: /search(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: spring-boot-service
                port:
                  number: 8081
