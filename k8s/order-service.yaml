apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/ahmetalpsamur/order-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: CATALOG_SERVICE_URL
              value: "http://catalog-service:8080"
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: showcase
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
