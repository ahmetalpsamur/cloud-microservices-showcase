apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog-service
          image: ghcr.io/ahmetalpsamur/catalog-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: showcase
spec:
  selector:
    app: catalog-service
  ports:
    - port: 8080
      targetPort: 8080
