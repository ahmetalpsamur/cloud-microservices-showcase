apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: showcase
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
    spec:
      containers:
        - name: go-service
          image: ghcr.io/example/go-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq:5672/"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: showcase
spec:
  selector:
    app: go-service
  ports:
    - port: 8080
      targetPort: 8080
